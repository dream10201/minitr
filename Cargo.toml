[package]
name = "minits"
version = "3.2.3"
edition = "2024"
description = "Mini AI translator living in the Windows system tray"
publish = false

[[bin]]
name = "MiniTranslation"
path = "src/main.rs"

[dependencies]
anyhow = "1"
jiff = "1"
log = { version = "0.4", features = ["std"] }
reqwest = { version = "0.13", default-features = false, features = ["native-tls", "http2", "system-proxy"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.11"
tokio = { version = "1", features = ["rt-multi-thread", "time"] }
zip = { version = "9", default-features = false, features = ["deflate-flate2-zlib-rs"] }

[target.'cfg(windows)'.dependencies]
futures = "0.3"
raw-window-handle = "0.6"
gpui-kit = { version = "0.11", default-features = false, features = ["component", "assets"] }
tray-icon = { version = "0.26", default-features = false }
windows = { version = "0.62", features = [
    "Foundation_Collections",
    "Media_Core",
    "Media_Playback",
    "Media_SpeechSynthesis",
    "Storage_Streams",
    "Win32_Foundation",
    "Win32_Graphics_Dwm",
    "Win32_Graphics_Gdi",
    "Win32_System_Com",
    "Win32_System_DataExchange",
    "Win32_System_LibraryLoader",
    "Win32_System_Memory",
    "Win32_System_Registry",
    "Win32_System_Ole",
    "Win32_System_TaskScheduler",
    "Win32_System_Threading",
    "Win32_System_Variant",
    "Win32_UI_Accessibility",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_Shell",
    "Win32_UI_WindowsAndMessaging",
] }

[dev-dependencies]
tokio = { version = "1", features = ["io-util", "macros", "net"] }

[build-dependencies]
embed-resource = "3"

[profile.release]
codegen-units = 1
lto = "fat"
strip = true
